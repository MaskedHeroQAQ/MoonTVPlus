name: Sync with upstream

on:
  schedule:
    - cron: '0 * * * *'  # 每小时检查一次
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if upstream has new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          echo "Local main: $LOCAL"
          echo "Upstream main: $UPSTREAM"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Local main already contains upstream/main"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has commits not yet in local main"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git identity
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          git merge upstream/main --no-edit
          git push origin main
          echo "deployed_ref=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger Cloudflare Deploy
        if: steps.merge.outputs.deployed_ref != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloudflare-deploy.yml',
              ref: 'main'
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
